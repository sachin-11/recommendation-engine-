[project]
name = "recommendation-engine"
version = "0.1.0"
description = "Multi-tenant, domain-agnostic recommendation engine SaaS (embeddings + vector search)."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0)",
    "asyncpg (>=0.30)",
    "alembic (>=1.14)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "email-validator (>=2.2)",
    "redis (>=5.2)",
    "openai (>=1.55)",
    "pinecone (>=5.4)",
    "tenacity (>=9.0)",
    "tiktoken (>=0.8)",
    "python-multipart (>=0.0.20)",
    "structlog (>=24.4)",
    "prometheus-client (>=0.21)",
    "sentry-sdk[fastapi] (>=2.19)",
    "langsmith (>=0.3)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
httpx = ">=0.28"
aiosqlite = ">=0.20"
fakeredis = ">=2.26"
ruff = ">=0.8"
mypy = ">=1.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown code samples are formatted for reading, not by ruff.
extend-exclude = ["*.md", "*.mdx"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# Third-party SDKs without complete type information.
[[tool.mypy.overrides]]
module = ["pinecone.*", "tiktoken.*", "fakeredis.*"]
ignore_missing_imports = true
