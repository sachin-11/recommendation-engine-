name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: reco
          POSTGRES_PASSWORD: reco
          POSTGRES_DB: reco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reco" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests use fakeredis and fake OpenAI/Pinecone; Postgres is real.
      TEST_DATABASE_URL: postgresql+asyncpg://reco:reco@localhost:5432/reco_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3.0"
      - name: Install dependencies
        run: poetry install --no-root --with dev
      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Type check
        run: poetry run mypy app
      - name: Tests (SQLite)
        run: env -u TEST_DATABASE_URL poetry run pytest -q
      - name: Tests (Postgres)
        run: poetry run pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://reco:reco@localhost:5432/reco_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-0123456789
        run: |
          poetry run alembic upgrade head
          poetry run alembic check
      - name: OpenAPI schema in docs is up to date
        run: |
          poetry run python scripts/export_openapi.py
          git diff --exit-code docs/static/openapi.json || {
            echo "::error::docs/static/openapi.json is stale. Run: python scripts/export_openapi.py"; exit 1; }

  dashboard:
    name: Dashboard (eslint, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  sdk-js:
    name: JS SDK (tsc, jest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/javascript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: Python SDK (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy recoengine
      - run: pytest -q

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: recoengine-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: false
          tags: recoengine-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
