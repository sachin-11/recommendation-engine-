# The FastAPI app. 2-5 replicas (autoscaled) behind one Service; the ingress (step 5) sends /api to it.
apiVersion: v1
kind: Service
metadata:
  name: api
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  selector: { app: api }
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # No `replicas`: the HorizontalPodAutoscaler (api-hpa.yaml) owns the count, 2 to 5. Setting
  # it here would reset a scaled-up API to 2 on every deploy.
  selector:
    matchLabels: { app: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # deploys never drop below 2 ready pods
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: recoengine-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: recoengine-config }
            - secretRef: { name: recoengine-secrets }
          # Ready = can serve: /health checks Postgres and Redis, so a pod gets no traffic
          # until they answer (e.g. while migrations run).
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Alive = the process responds at all. Not /health: a database outage must not make
          # Kubernetes restart every API pod.
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
