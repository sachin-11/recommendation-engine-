# Catches the app's emails (e.g. email verification links). Its web UI is not exposed:
#   kubectl -n recoengine port-forward svc/mailpit 8025:8025   then open localhost:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app: mailpit }
  ports:
    - name: smtp
      port: 1025
    - name: web
      port: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports:
            - containerPort: 1025
            - containerPort: 8025
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
