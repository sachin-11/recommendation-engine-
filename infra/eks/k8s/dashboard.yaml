# The Next.js dashboard. It calls the API on its own origin (/api), which the ingress routes.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector: { app: dashboard }
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: recoengine-dashboard
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
