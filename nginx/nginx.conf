# Reverse proxy for docker-compose.prod.yml:
#   /api/*, /health  -> FastAPI (app:8000)
#   /                -> Next.js dashboard (dashboard:3000)
#   /metrics         -> blocked (Prometheus scrapes it on the internal network)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 12m;   # CSV uploads are capped at 10 MB by the API

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'rid=$upstream_http_x_request_id';
    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # ---------------------------------------------------------------- rate limiting
    # Burst protection in front of the API's own per-key limits (100 req/min).
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---------------------------------------------------------------- upstreams
    upstream api {
        server app:8000;
        keepalive 32;
    }
    upstream dashboard {
        server dashboard:3000;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt HTTP-01 challenges (see the certbot service).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Once HTTPS is set up, replace everything below with:
        #   location / { return 301 https://$host$request_uri; }

        include /etc/nginx/conf.d/recoengine-locations.inc;
    }

    # ---------------------------------------------------------------- HTTPS
    # 1. Point your DNS at the server and start the stack.
    # 2. docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot \
    #      -w /var/www/certbot -d recoengine.example.com --email you@example.com --agree-tos
    # 3. Uncomment this block, set server_name, and add the redirect above.
    # 4. docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
    #
    # server {
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    #     server_name recoengine.example.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/recoengine.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/recoengine.example.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #     include /etc/nginx/conf.d/recoengine-locations.inc;
    # }
}
